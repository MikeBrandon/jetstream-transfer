[package]
name = "jetstream-core"
description = "Transport, identity, and transfer engine for Jetstream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true

quinn.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
rcgen.workspace = true
x509-parser.workspace = true

blake3.workspace = true
zstd.workspace = true
serde.workspace = true
postcard.workspace = true
serde_json.workspace = true
zeroize.workspace = true

thiserror.workspace = true
tracing.workspace = true

directories.workspace = true
socket2.workspace = true
walkdir.workspace = true
hex.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }

[dev-dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
# Test-only: finds a real link-local interface to prove a scope id survives the
# whole quinn/socket2/OS stack, which the direct-cable fix depends on.
if-addrs = "0.15"
walkdir.workspace = true
blake3.workspace = true
tracing-subscriber.workspace = true

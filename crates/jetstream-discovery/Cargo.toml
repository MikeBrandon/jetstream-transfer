[package]
name = "jetstream-discovery"
description = "Peer discovery and network diagnostics for Jetstream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
jetstream-core.workspace = true

tokio.workspace = true
mdns-sd = "0.21"
socket2.workspace = true
# Already in the tree via mdns-sd. Needed directly to broadcast to each
# interface's own subnet rather than betting on the routing table.
if-addrs = "0.15"

serde.workspace = true
postcard.workspace = true
thiserror.workspace = true
tracing.workspace = true
hex.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Networking_NetworkListManager",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Variant",
    "Win32_NetworkManagement_IpHelper",
    # GetIfEntry2/MIB_IF_ROW2 live behind this one, which is where the
    # adapter's negotiated link speed is reported.
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["test-util"] }
